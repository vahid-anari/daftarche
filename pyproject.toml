[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance"
version = "0.1.0"
description = "Finance Manager: track bank transactions imported from QFX and Excel statements"
readme = "README.md"
authors = [{ name = "Vahid Anari", email = "vahid.anari8@gmail.com" }]
requires-python = ">=3.10"
keywords = ["personal finance", "budget", "QFX", "OFX", "CIBC", "PySide6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "PySide6>=6.6",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "sciwidgets~=0.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "build", "twine"]
icon = ["Pillow", "numpy"]

[project.scripts]
finance = "finance.main:main"

[project.urls]
Source = "https://github.com/vahid-anari/finance"
Changelog = "https://github.com/vahid-anari/finance/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance = ["data/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
