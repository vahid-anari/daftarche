[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daftarche"
version = "0.3.0"
description = "Daftarche: personal bookkeeping for bank transactions imported from QFX and Excel statements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vahid Anari", email = "vahid.anari8@gmail.com" }]
requires-python = ">=3.10"
keywords = ["personal finance", "bookkeeping", "budget", "QFX", "OFX", "CIBC", "PySide6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "PySide6>=6.6",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "sciwidgets~=0.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "build", "twine"]
icon = ["Pillow", "numpy"]

[project.scripts]
daftarche = "daftarche.main:main"

[project.urls]
Homepage = "https://github.com/vahid-anari/daftarche"
Source = "https://github.com/vahid-anari/daftarche"
Issues = "https://github.com/vahid-anari/daftarche/issues"
Changelog = "https://github.com/vahid-anari/daftarche/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daftarche = ["data/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
