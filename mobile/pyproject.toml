[project]
name = "daftarche-phone"
version = "0.3.1"
description = "Daftarche on the phone: a read-only view of your account book"
readme = "README.md"
license = "MIT"
authors = [{ name = "Vahid Anari", email = "vahid.anari8@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "certifi",  # certificates for the update check (Python on a phone has none of its own)
]

[tool.flet]
product = "Daftarche"
artifact = "daftarche"
org = "io.github.vahid_anari"
company = "Vahid Anari"
copyright = "Copyright (C) 2026 Vahid Anari"

# icon: assets/icon_android.png, splash: assets/splash.png (both from tools/make_icon.py)
icon_background = "#1e1c18"

[tool.flet.splash]
color = "#1e1c18"
dark_color = "#1e1c18"

[tool.flet.android.deep_linking]
# the QR code on the Mac holds daftarche://pair?…: the phone's camera opens the app with it
scheme = "daftarche"
host = "pair"

[tool.flet.app]
path = "src"
module = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
